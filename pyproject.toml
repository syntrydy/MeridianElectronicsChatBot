[project]
name = "meridianelectronicschatbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.13.0",
    "langchain>=1.2.16",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.1",
    "langfuse>=4.5.1",
    "langgraph>=1.1.10",
    "pydantic-settings>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not smoke'"
markers = [
    "smoke: hits live MCP / OpenAI / Langfuse — opt-in via -m smoke",
]
